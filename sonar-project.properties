# Configuration SonarQube / SonarCloud — analyse SAST (US-11-06)
# sonar.organization est injectée par le workflow GitHub (-Dsonar.organization=...).
sonar.projectKey=m-motors-lld
sonar.projectName=M Motors LLD

sonar.sources=frontend,backend
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/htmlcov/**,**/dist/**,**/__pycache__/**,**/venv/**,**/*.min.js,**/migrations/**

sonar.sourceEncoding=UTF-8

# Couverture — générée par le workflow « Sonar / PR »
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
