---
# ============================================================
# WORKFLOW — Deploy STAGING
# Déclencheur : push sur main (merge de PR)
# Déploiement automatique + smoke tests étendus
# ============================================================
name: Deploy → STAGING

on:
  push:
    branches:
      - main
    paths:
      - '!**.md'
      - 'backend/**'
      - 'frontend/**'
      - '!.gitignore'
      - '!LICENSE'
      - '!docker-compose.yml'
      - '!.github/**'
  workflow_dispatch:

# Permissions requises par le workflow réutilisable ci.yaml (job build : push GHCR + SARIF Trivy).
permissions:
  contents: read
  packages: write
  security-events: write

env:
  NAMESPACE: staging
  IMAGE_TAG: staging-${{ github.sha }}
  # Cible DAST (OWASP ZAP) — surcharge via vars.STAGING_DAST_TARGET si besoin.
  STAGING_DAST_TARGET: ${{ vars.STAGING_DAST_TARGET != '' && vars.STAGING_DAST_TARGET || 'https://staging.opsdev.fr' }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yaml
    with:
      environment: staging
      image_tag: staging-${{ github.sha }}
      run_integration_tests: true

  deploy:
    name: Deploy to STAGING
    runs-on: ubuntu-latest
    needs: ci
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false  # Ne pas annuler en staging, laisser finir

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Verify cluster connectivity and RBAC
        run: |
          # Vérifie explicitement les permissions nécessaires au déploiement.
          kubectl auth can-i get deployments -n ${{ env.NAMESPACE }}
          kubectl auth can-i patch deployments -n ${{ env.NAMESPACE }}

      - name: Update image tags
        working-directory: k8s/overlays/staging
        run: |
          kustomize edit set image \
            ghcr.io/${{ github.repository }}-frontend=ghcr.io/${{ github.repository }}-frontend:staging-${{ github.sha }} \
            ghcr.io/${{ github.repository }}-backend=ghcr.io/${{ github.repository }}-backend:staging-${{ github.sha }}

      - name: Apply manifests
        run: |
          kustomize build k8s/overlays/staging | kubectl apply -f -

      - name: Wait for rollout — frontend
        run: |
          kubectl rollout status deployment/frontend \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s

      - name: Wait for rollout — backend
        run: |
          kubectl rollout status deployment/backend \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s

      - name: Extended smoke tests
        run: |
          BASE_URL="https://staging.opsdev.fr"

          # Test via endpoint public HTTPS (retry étendu pour laisser le temps au pod de démarrer)
          curl -f --retry 12 --retry-delay 10 --retry-connrefused \
            "$BASE_URL/api/healthz" \
            -H "User-Agent: GitHub-Actions-SmokeTest"

          # Test readiness backend
          curl -f --retry 5 --retry-delay 10 --retry-connrefused \
            "$BASE_URL/api/readyz"

          # Test frontend répond
          curl -f --retry 5 --retry-delay 10 --retry-connrefused \
            "$BASE_URL/" \
            -o /dev/null -w "HTTP Status: %{http_code}\n"

          echo "✅ Tous les smoke tests passés"

      # ── DAST — OWASP ZAP (US-11-06) : gate avant de valider le déploiement staging
      # Baseline : -l ∈ PASS|IGNORE|INFO|WARN|FAIL. Sans -I, tout WARN-NEW → exit 2 (scan KO).
      # -I (ignore_warn) : on ne fait échouer le job que si FAIL-NEW/FAIL-INPROG > 0 (exit 1).
      # Retirer -I pour bloquer aussi sur les WARN (bruit fréquent sur SPA / cookies / headers).
      - name: OWASP ZAP — Baseline scan (staging)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ env.STAGING_DAST_TARGET }}
          cmd_options: "-m 3 -l WARN -I"
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-dast-staging-${{ github.run_id }}

      - name: Rapport sécurité DAST + cycle staging (archive)
        if: always()
        run: |
          cat > security-report-dast-staging.md << EOF
          # Rapport sécurité — DAST / déploiement staging

          | Champ | Valeur |
          |-------|--------|
          | Workflow | ${{ github.workflow }} |
          | Run | ${{ github.run_id }} |
          | Cible ZAP | ${{ env.STAGING_DAST_TARGET }} |
          | Commit | ${{ github.sha }} |
          | Artefact ZAP | zap-dast-staging-${{ github.run_id }} |

          Les fichiers détaillés (HTML/JSON) sont joints à l’artefact **zap-dast-staging-${{ github.run_id }}**.
          Avec **`-I`** : échec CI uniquement s’il existe des alertes **FAIL** (FAIL-NEW / FAIL-INPROG) ; les **WARN** restent visibles dans l’artefact pour analyse. Sans **`-I`**, des WARN-NEW suffisent à faire échouer le job (exit **2**).
          EOF

      - name: Upload rapport sécurité consolidé (staging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report-staging-${{ github.run_id }}
          path: security-report-dast-staging.md
          retention-days: 90

      - name: Vérifier résultat tests d'intégration (exécutés dans le job CI)
        run: |
          echo "✅ Les tests d'intégration backend ont été exécutés dans le job 'CI → Integration Tests'."
          echo "   Résultats disponibles dans les logs du job ci (integration-tests)."

      - name: Rollback si déploiement échoué
        if: failure()
        run: |
          echo "Déploiement staging échoué, rollback..."
          kubectl rollout undo deployment/frontend -n ${{ env.NAMESPACE }}
          kubectl rollout undo deployment/backend -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/frontend -n ${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/backend -n ${{ env.NAMESPACE }} --timeout=120s

      - name: Notify Slack — Success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🟡 *STAGING* déployé — prêt pour validation",
              "attachments": [{
                "color": "warning",
                "fields": [
                  {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                  {"title": "Auteur", "value": "${{ github.actor }}", "short": true},
                  {"title": "URL Staging", "value": "https://staging.opsdev.fr", "short": false},
                  {"title": "Action requise", "value": "Valider puis créer un tag pour déployer en production", "short": false}
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack — Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🔴 *STAGING* déploiement échoué",
              "attachments": [{
                "color": "danger",
                "fields": [
                  {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                  {"title": "Logs", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false}
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
