---
# ============================================================
# WORKFLOW — Deploy PRODUCTION
# Déclencheur : création d'un tag Git vX.Y.Z
# Approbation manuelle obligatoire via GitHub Environments
# ============================================================
name: Deploy → PRODUCTION

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"  # Uniquement les tags semver (v1.2.3)
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à déployer (ex: v1.2.3)"
        required: true
        type: string

# Permissions minimales au niveau workflow ; contents: write est élevé au niveau du job deploy uniquement.
permissions:
  contents: read
  packages: write
  security-events: write

env:
  NAMESPACE: production

jobs:
  # ----------------------------------------------------------
  # Validation du tag et contexte
  # ----------------------------------------------------------
  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Déploiement de la version: $VERSION"

      - name: Checkout (commit du tag)
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.get_version.outputs.version }}

      - name: Verify tag exists and is on main
        run: |
          TAG="${{ steps.get_version.outputs.version }}"
          git fetch --tags origin main
          TAG_COMMIT=$(git rev-list -n 1 "${TAG}" 2>/dev/null || echo "")
          if [ -z "$TAG_COMMIT" ]; then
            echo "❌ Tag ${TAG} introuvable"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "❌ Le commit du tag ${TAG} n'est pas sur la branche main"
            exit 1
          fi
          echo "✅ Tag ${TAG} trouvé sur main, commit: ${TAG_COMMIT}"

  # ----------------------------------------------------------
  # CI : rebuild avec le tag de production
  # ----------------------------------------------------------
  ci:
    name: CI
    needs: validate
    uses: ./.github/workflows/ci.yaml
    with:
      environment: production
      image_tag: ${{ needs.validate.outputs.version }}
      git_ref: ${{ needs.validate.outputs.version }}

  # ----------------------------------------------------------
  # APPROBATION MANUELLE — Bloque ici jusqu'à validation
  # Configurer dans GitHub > Settings > Environments > production
  # Ajouter des "Required reviewers"
  # ----------------------------------------------------------
  deploy:
    name: Deploy to PRODUCTION
    runs-on: ubuntu-latest
    needs: [validate, ci]
    environment: production  # 👈 Bloque jusqu'à approbation dans GitHub UI
    permissions:
      contents: write  # requis pour créer la GitHub Release (softprops/action-gh-release)
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # URL publique alignée avec l'Ingress prod (voir k8s/overlays/production/ingress.yaml).
    # Override optionnel : variable dépôt PRODUCTION_SMOKE_BASE_URL (ex. https://www.opsdev.fr).
    env:
      PRODUCTION_PUBLIC_URL: ${{ vars.PRODUCTION_SMOKE_BASE_URL != '' && vars.PRODUCTION_SMOKE_BASE_URL || 'https://opsdev.fr' }}

    steps:
      - name: Checkout (commit du tag)
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.version }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Snapshot état actuel (pour rollback manuel si besoin)
        run: |
          kubectl get deployments -n ${{ env.NAMESPACE }} -o yaml > /tmp/pre-deploy-state.yaml
          CURRENT_FRONTEND=$(kubectl get deployment frontend -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.template.spec.containers[0].image}')
          CURRENT_BACKEND=$(kubectl get deployment backend -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "Image frontend actuelle: $CURRENT_FRONTEND"
          echo "Image backend actuelle: $CURRENT_BACKEND"
          echo "PREVIOUS_FRONTEND=$CURRENT_FRONTEND" >> $GITHUB_ENV
          echo "PREVIOUS_BACKEND=$CURRENT_BACKEND" >> $GITHUB_ENV

      - name: Update image tags (production — tag semver)
        working-directory: k8s/overlays/production
        run: |
          kustomize edit set image \
            ghcr.io/${{ github.repository }}-frontend=ghcr.io/${{ github.repository }}-frontend:${{ needs.validate.outputs.version }} \
            ghcr.io/${{ github.repository }}-backend=ghcr.io/${{ github.repository }}-backend:${{ needs.validate.outputs.version }}

      - name: Apply manifests (production)
        run: |
          kustomize build k8s/overlays/production | kubectl apply -f -

      - name: Wait for rollout — frontend (timeout 2 min)
        id: rollout_frontend
        run: |
          kubectl rollout status deployment/frontend \
            -n ${{ env.NAMESPACE }} \
            --timeout=120s

      - name: Wait for rollout — backend (timeout 2 min)
        id: rollout_backend
        run: |
          kubectl rollout status deployment/backend \
            -n ${{ env.NAMESPACE }} \
            --timeout=120s

      - name: Production smoke tests (via HTTPS public)
        id: smoke_tests
        run: |
          # Smoke tests contre l'hôte défini dans PRODUCTION_PUBLIC_URL (Ingress TLS).
          # --retry-connrefused + retry étendu remplace le sleep fixe de stabilisation.
          echo "Smoke tests sur: $PRODUCTION_PUBLIC_URL"

          # -fsS : échec sur HTTP ≥400 (ex. 503 readyz), erreurs TLS/réseau visibles (-S).
          # --http1.1 : évite des cas HTTP/2 + Ingress où une coupure pendant le corps → exit 23 (write error) avec -o /dev/null.
          # readyz interroge la DB : max-time plus long qu’healthz pour absorber le pic post-rollout.
          _check() {
            local label="$1" url="$2" maxt="${3:-25}"
            local curl_exit=0
            curl -fsS -o /dev/null --http1.1 \
              --max-time "$maxt" --connect-timeout 15 \
              --retry 18 --retry-delay 10 --retry-connrefused \
              -H "User-Agent: GitHub-Actions-ProdSmokeTest" \
              "$url" || curl_exit=$?
            if [ "$curl_exit" -ne 0 ]; then
              echo "❌ $label — curl a échoué (exit $curl_exit)"
              return 1
            fi
            echo "✅ $label → HTTP OK"
          }

          _check "/api/healthz" "${PRODUCTION_PUBLIC_URL}/api/healthz" 25
          _check "/api/readyz"  "${PRODUCTION_PUBLIC_URL}/api/readyz" 60
          _check "/"            "${PRODUCTION_PUBLIC_URL}/" 25

          echo "✅ Tous les smoke tests production passés"

      # ----------------------------------------------------------
      # ROLLBACK AUTOMATIQUE si une étape échoue
      # ----------------------------------------------------------
      - name: Rollback automatique
        if: failure()
        run: |
          echo "🔄 Rollback production en cours..."
          kubectl rollout undo deployment/frontend -n ${{ env.NAMESPACE }}
          kubectl rollout undo deployment/backend -n ${{ env.NAMESPACE }}

          echo "Attente du rollback..."
          kubectl rollout status deployment/frontend -n ${{ env.NAMESPACE }} --timeout=180s
          kubectl rollout status deployment/backend -n ${{ env.NAMESPACE }} --timeout=180s

          echo "✅ Rollback terminé. Vérifier l'état du cluster."

      - name: Créer GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          name: "Release ${{ needs.validate.outputs.version }}"
          body: |
            ## Déploiement production — ${{ needs.validate.outputs.version }}

            Déployé par : @${{ github.actor }}
            Date : ${{ github.run_started_at }}

            ### Images déployées
            - Frontend : `ghcr.io/${{ github.repository }}-frontend:${{ needs.validate.outputs.version }}`
            - Backend : `ghcr.io/${{ github.repository }}-backend:${{ needs.validate.outputs.version }}`
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack — Production déployée
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚀 *PRODUCTION* déployée avec succès — ${{ needs.validate.outputs.version }}",
              "attachments": [{
                "color": "good",
                "fields": [
                  {"title": "Version", "value": "${{ needs.validate.outputs.version }}", "short": true},
                  {"title": "Déployé par", "value": "${{ github.actor }}", "short": true},
                  {"title": "URL", "value": "${{ env.PRODUCTION_PUBLIC_URL }}", "short": false},
                  {"title": "Release notes", "value": "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.version }}", "short": false}
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack — Rollback production
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚨 *PRODUCTION* déploiement échoué — Rollback automatique effectué",
              "attachments": [{
                "color": "danger",
                "fields": [
                  {"title": "Version tentée", "value": "${{ needs.validate.outputs.version }}", "short": true},
                  {"title": "Initié par", "value": "${{ github.actor }}", "short": true},
                  {"title": "Logs", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false},
                  {"title": "ACTION REQUISE", "value": "Vérifier immédiatement l'état de production", "short": false}
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ----------------------------------------------------------
  # JOB de vérification post-déploiement (15 min après)
  # ----------------------------------------------------------
  post-deploy-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    env:
      PRODUCTION_PUBLIC_URL: ${{ vars.PRODUCTION_SMOKE_BASE_URL != '' && vars.PRODUCTION_SMOKE_BASE_URL || 'https://opsdev.fr' }}

    steps:
      - name: Extended health check (stabilité sur 5 minutes)
        run: |
          # Premier check avec retry étendu (jusqu'à 3 min) pour absorber le démarrage.
          for i in {1..18}; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
              "${PRODUCTION_PUBLIC_URL}/api/healthz" --max-time 10 -k)
            [ "$STATUS" = "200" ] && break
            [ "$i" -eq 18 ] && { echo "❌ Timeout : service non disponible après 3 minutes"; exit 1; }
            sleep 10
          done
          echo "Check 1/5 → OK"

          # Vérifications de stabilité toutes les minutes (4 checks supplémentaires = 4 min)
          for i in {2..5}; do
            sleep 60
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
              "${PRODUCTION_PUBLIC_URL}/api/healthz" --max-time 10 -k)
            echo "Check $i/5 → HTTP $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "❌ Health check $i échoué"
              exit 1
            fi
          done
          echo "✅ Production stable"

  # ----------------------------------------------------------
  # JOB de nettoyage — supprime la release et son tag uniquement si
  # validate, ci ou deploy échoue (pas si seul post-deploy-check échoue).
  # ----------------------------------------------------------
  cleanup-on-failure:
    name: Supprimer la release en cas d'échec
    runs-on: ubuntu-latest
    needs: [validate, ci, deploy, post-deploy-check]
    if: |
      always() && (
        needs.validate.result == 'failure' ||
        needs.ci.result == 'failure' ||
        needs.deploy.result == 'failure'
      )
    permissions:
      contents: write

    steps:
      - name: Supprimer la release GitHub et son tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Priorité : version calculée par validate ; fallback sur la ref Git (tag push).
          VERSION="${{ needs.validate.outputs.version }}"
          [ -z "$VERSION" ] && VERSION="${GITHUB_REF_NAME}"

          echo "⚠️  Workflow échoué — suppression de la release ${VERSION}..."

          gh release delete "${VERSION}" \
            --repo "${{ github.repository }}" \
            --yes \
            --cleanup-tag \
          && echo "✅ Release ${VERSION} et son tag supprimés." \
          || echo "ℹ️  Release ${VERSION} introuvable (non créée avant l'échec)."
