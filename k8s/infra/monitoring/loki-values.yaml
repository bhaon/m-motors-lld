---
# ============================================================
# LOKI — Agrégation des logs (stack légère pour VPS)
# Installation (release DOIT s'appeler « loki » pour le Service DNS) :
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm upgrade --install loki grafana/loki-stack \
#     -n monitoring \
#     -f k8s/infra/monitoring/loki-values.yaml
# ============================================================

loki:
  enabled: true
  # Ne pas marquer Loki comme datasource par défaut (Prometheus l’est déjà via kube-prometheus-stack).
  isDefault: false
  datasource:
    uid: loki
  persistence:
    enabled: true
    storageClassName: local-path
    size: 40Gi
  config:
    limits_config:
      # US-08-03 : 90 jours de rétention (DoD). Ajuster la taille PVC si le volume grossit vite.
      retention_period: 2160h
      ingestion_rate_mb: 4
      ingestion_burst_size_mb: 8
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

promtail:
  enabled: true
  # K3s : pipeline cri + chemins /var/log/pods (défaut du chart promtail ≥ 6.x).
  # Ne pas définir scrape_configs ici : le chart l'ignore et utilise config.snippets.
  config:
    clients:
      # Même namespace « monitoring » ; release Helm = « loki » → Service « loki ».
      - url: http://loki:3100/loki/api/v1/push
    snippets:
      pipelineStages:
        - cri: {}
      extraRelabelConfigs:
        # Monitoring limité à la production (US-08).
        - action: keep
          source_labels: [__meta_kubernetes_namespace]
          regex: production
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

grafana:
  enabled: false    # Grafana déjà installé via kube-prometheus-stack
  # Ne pas créer le ConfigMap grafana_datasource (sinon conflit isDefault avec Prometheus).
  sidecar:
    datasources:
      enabled: false
