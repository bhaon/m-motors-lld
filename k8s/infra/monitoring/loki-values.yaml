---
# ============================================================
# LOKI — Agrégation des logs (stack légère pour VPS)
# Installation via Helm :
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm install loki grafana/loki-stack \
#     -n monitoring \
#     -f k8s/infra/monitoring/loki-values.yaml
# ============================================================

# loki-values.yaml
loki:
  enabled: true
  persistence:
    enabled: true
    storageClassName: local-path
    size: 40Gi
  config:
    limits_config:
      # US-08-03 : 90 jours de rétention (DoD). Ajuster la taille PVC si le volume grossit vite.
      retention_period: 2160h
      ingestion_rate_mb: 4
      ingestion_burst_size_mb: 8
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

promtail:
  enabled: true
  config:
    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods-production
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - production
        # K3s / containerd : utiliser « cri », pas « docker » (sinon aucun log ingéré).
        pipeline_stages:
          - cri: {}
        relabel_configs:
          # Ne collecter que les pods du namespace production (aligné monitoring prod seul).
          - action: keep
            source_labels: [__meta_kubernetes_namespace]
            regex: production
          - action: keep
            source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_label_environment]
            target_label: environment
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

grafana:
  enabled: false    # Grafana déjà installé via kube-prometheus-stack
