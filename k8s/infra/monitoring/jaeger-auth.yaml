---
# Basic Auth Traefik — UI Jaeger (https://jaeger.opsdev.fr).
# Le Secret n’est PAS versionné ici (évite qu’un apply -k écrase le mot de passe).
# Création : ./scripts/setup-jaeger-auth-secret.sh 'VotreMotDePasseFort'
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jaeger-auth
  labels:
    app: jaeger
spec:
  basicAuth:
    secret: jaeger-auth-secret
    removeHeader: true
