---
# TLS — UI Jaeger (production)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jaeger-production-tls
  labels:
    app: jaeger
spec:
  secretName: jaeger-production-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - jaeger.opsdev.fr
---
# Redirection HTTP → HTTPS (même principe que les overlays applicatifs ; cert-manager HTTP-01 reste prioritaire).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger-http-redirect
  labels:
    app: jaeger
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-redirect-to-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: jaeger.opsdev.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jaeger
                port:
                  number: 16686
---
# UI Jaeger — production (https://jaeger.opsdev.fr).
# Middlewares : uniquement kube-system (compress). Ne pas référencer production-rate-limit
# depuis le namespace monitoring : si le Middleware production n’est pas déployé → 502.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger-ui-production
  labels:
    app: jaeger
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/service.passhostheader: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-compress@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - jaeger.opsdev.fr
      secretName: jaeger-production-tls-secret
  rules:
    - host: jaeger.opsdev.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jaeger
                port:
                  number: 16686
