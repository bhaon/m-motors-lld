---
# DÉPRÉCIÉ sans Istio — beaucoup d'erreurs UI ; préférer Jaeger (System Architecture).
# Ne pas installer sauf si un service mesh Istio est déployé.
# Kiali — console topologie (nécessite Istio pour un usage correct).
# Installation :
#   helm repo add kiali https://kiali.org/helm-charts
#   helm upgrade --install kiali kiali/kiali-server \
#     -n monitoring \
#     -f k8s/infra/monitoring/kiali-values.yaml
#
# Prérequis : otel-collector + Prometheus + Jaeger dans le namespace monitoring.

auth:
  strategy: anonymous

login_token:
  signing_key: "mmotors-kiali-opsdev-fr"

deployment:
  instance_name: kiali
  cluster_wide_access: true
  network_policy:
    enabled: false
  pod_annotations: {}
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

external_services:
  prometheus:
    url: "http://kube-prometheus-stack-prometheus.monitoring:9090/"
  tracing:
    enabled: true
    internal_url: "http://jaeger.monitoring.svc.cluster.local:16686"
    use_grpc: false
  istio:
    istio_api_enabled: false

kiali_feature_flags:
  # « istio » n’est pas un nom valide (seul ex. « logs-tab ») — désactiver les actions Istio :
  istio_annotation_action: false
  istio_injection_action: false
  istio_upgrade_action: false
