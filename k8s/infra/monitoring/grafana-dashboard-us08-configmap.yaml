---
# Dashboard Grafana — US-08-03 (déployé dans « monitoring », label sidecar kube-prometheus-stack).
# Prérequis : Helm kube-prometheus-stack avec sidecar dashboards activé (défaut).
#   kubectl apply -f k8s/infra/monitoring/grafana-dashboard-us08-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-mm-us08
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: mmotors-observability
data:
  mmotors-us08.json: |
    {
      "title": "M-Motors — Observabilité V1 (US-08-03)",
      "uid": "mmotors-us08",
      "schemaVersion": 39,
      "version": 5,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "custom",
            "query": "production",
            "current": { "selected": true, "text": "production", "value": "production" },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [
              { "selected": true, "text": "production", "value": "production" }
            ]
          },
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "pluginId": "prometheus",
            "query": "prometheus",
            "current": {},
            "hide": 2,
            "refresh": 1
          },
          {
            "name": "DS_LOKI",
            "type": "datasource",
            "pluginId": "loki",
            "query": "loki",
            "current": {},
            "hide": 2,
            "refresh": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Requêtes HTTP / s (backend)",
          "gridPos": { "h": 4, "w": 8, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(rate(http_requests_total{namespace=\"$namespace\",pod=~\"backend.*\"}[5m]))",
              "refId": "A"
            }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Taux 5xx (%)",
          "gridPos": { "h": 4, "w": 8, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "100 * (sum(rate(http_requests_total{namespace=\"$namespace\",pod=~\"backend.*\",status=\"5xx\"}[5m])) or on() vector(0)) / clamp_min(sum(rate(http_requests_total{namespace=\"$namespace\",pod=~\"backend.*\"}[5m])), 1e-9)",
              "refId": "A"
            }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latence P95 API (s) — histogramme highr",
          "gridPos": { "h": 9, "w": 16, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_highr_seconds_bucket{namespace=\"$namespace\",pod=~\"backend.*\"}[5m])) by (le))",
              "legendFormat": "p95",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Saturation CPU — conteneur backend (cores)",
          "gridPos": { "h": 8, "w": 16, "x": 0, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",pod=~\"backend.*\",container=\"backend\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "logs",
          "title": "Logs pod backend — datasource Loki (pas Prometheus)",
          "gridPos": { "h": 14, "w": 24, "x": 0, "y": 21 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "editorMode": "code",
              "expr": "{namespace=\"$namespace\", app=\"backend\", container=\"backend\"}",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": true,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          }
        }
      ]
    }
