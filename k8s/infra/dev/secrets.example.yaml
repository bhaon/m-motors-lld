---
# ============================================================
# SECRETS — PRODUCTION (valeurs placeholder)
# À adapter avant usage en environnement réel.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  # Doit être fourni au backend (JWT). Mettre une valeur >= 32 caractères.
  SECRET_KEY: "CHANGE_ME_PRODUCTION_SECRET_KEY_AT_LEAST_32_CHARS"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  POSTGRES_DB: "myapp"
  POSTGRES_USER: "myapp_user"
  POSTGRES_PASSWORD: "CHANGE_ME_POSTGRES_PASSWORD"
  # Utilisé par le backend + initContainer db-migrate
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
type: Opaque
stringData:
  # Mot de passe Redis utilisé par le service Redis et le backend.
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: resend-credentials
type: Opaque
stringData:
  # Clé API Resend pour l'envoi d'emails transactionnels.
  RESEND_API_KEY: "CHANGE_ME_RESEND_API_KEY"
  # Adresse expéditeur utilisée pour les emails de vérification.
  RESEND_FROM_EMAIL: "CHANGE_ME_RESEND_FROM_EMAIL"
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
type: Opaque
stringData:
  # Identifiants d'accès MinIO (backend -> API S3 compatible).
  MINIO_ROOT_USER: "mmotors-production-minio"
  MINIO_ROOT_PASSWORD: "mmotors-production-minio-pass-change-me-2026"
---
# ============================================================
# IMAGE PULL SECRET — GHCR (GitHub Container Registry)
# PAT avec scope read:packages UNIQUEMENT
# Renouveler avant expiration → resceller : scripts/seal-secrets.sh production
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "CHANGE_ME_GITHUB_USERNAME",
          "password": "CHANGE_ME_GITHUB_PAT",
          "auth": "CHANGE_ME_GITHUB_AUTH"
        }
      }
    }
