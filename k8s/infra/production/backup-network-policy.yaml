---
# ============================================================
# NETWORK POLICY — CronJob Backup PostgreSQL
# Autorise le pod de backup à joindre PostgreSQL et MinIO
# Le pod est identifié par le label : app: postgresql-backup
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backup-job-policy
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: postgresql-backup
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgresql
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - port: 9000
    - to:  # DNS
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP