---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: staging
data:
  NODE_ENV: "production"
  ENVIRONMENT: "staging"
  # Base URL publique du frontend (utilisée par le backend pour générer les liens d'email).
  FRONTEND_BASE_URL: "https://staging.netdevops.fr"
  API_INTERNAL_URL: "http://backend"
  API_URL: "https://staging.netdevops.fr/api"
  S3_ENDPOINT_URL: "http://minio:9000"
  S3_BUCKET: "mmotors-documents-staging"
  ALLOWED_HOSTS: "staging.netdevops.fr"
  LOG_LEVEL: "info"
  DEBUG: "false"
