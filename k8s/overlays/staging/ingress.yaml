---
# ============================================================
# INGRESS — staging (Traefik + cert-manager)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: staging
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - staging.netdevops.fr
      secretName: staging-tls-secret
  rules:
    - host: staging.netdevops.fr
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
---
# ============================================================
# INGRESS — staging (route S3 dédiée)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: s3-ingress
  namespace: staging
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/service.passhostheader: "true"
    # Référence Traefik CRD : <nom-middleware>-<namespace>@kubernetescrd (Middleware ci-dessous : s3-cors / staging)
    traefik.ingress.kubernetes.io/router.middlewares: s3-cors-staging@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - s3-staging.netdevops.fr
      secretName: s3-staging-tls-secret
  rules:
    - host: s3-staging.netdevops.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
---
# ============================================================
# MIDDLEWARE — CORS upload objet (staging)
# ============================================================
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: s3-cors
  namespace: staging
spec:
  headers:
    accessControlAllowOriginList:
      - "https://staging.netdevops.fr"
    accessControlAllowMethods:
      - "GET"
      - "HEAD"
      - "PUT"
      - "OPTIONS"
    accessControlAllowHeaders:
      - "*"
    accessControlExposeHeaders:
      - "ETag"
      - "x-amz-request-id"
      - "x-amz-id-2"
      - "x-amz-checksum-sha256"
    accessControlMaxAge: 3600
    addVaryHeader: true
---
# ============================================================
# CERTIFICATE — TLS dédié pour s3-staging
# ============================================================
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: s3-staging-tls
  namespace: staging
spec:
  secretName: s3-staging-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - s3-staging.netdevops.fr
