---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Rate limiting en production
    traefik.ingress.kubernetes.io/router.middlewares: production-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - netdevops.fr
        - www.netdevops.fr
      secretName: production-tls-secret
  rules:
    - host: netdevops.fr
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
    - host: www.netdevops.fr
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
---
# ============================================================
# INGRESS — production (route S3 dédiée)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: s3-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/service.passhostheader: "true"
    traefik.ingress.kubernetes.io/router.middlewares: s3-cors-production@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - s3.netdevops.fr
      secretName: s3-production-tls-secret
  rules:
    - host: s3.netdevops.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
---
# ============================================================
# MIDDLEWARE — CORS upload objet (production)
# ============================================================
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: s3-cors
  namespace: production
spec:
  headers:
    accessControlAllowOriginList:
      - "https://netdevops.fr"
      - "https://www.netdevops.fr"
    accessControlAllowMethods:
      - "GET"
      - "HEAD"
      - "PUT"
      - "OPTIONS"
    accessControlAllowHeaders:
      - "*"
    accessControlExposeHeaders:
      - "ETag"
      - "x-amz-request-id"
      - "x-amz-id-2"
      - "x-amz-checksum-sha256"
    accessControlMaxAge: 3600
    addVaryHeader: true
---
# ============================================================
# CERTIFICATE — TLS dédié pour s3.netdevops.fr
# ============================================================
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: s3-production-tls
  namespace: production
spec:
  secretName: s3-production-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - s3.netdevops.fr