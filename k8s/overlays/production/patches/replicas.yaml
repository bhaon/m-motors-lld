---
# patches/replicas.yaml — PRODUCTION : 2 replicas minimum pour la HA
# L'HPA (hpa.yaml) peut monter jusqu'à 5 replicas selon la charge.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
