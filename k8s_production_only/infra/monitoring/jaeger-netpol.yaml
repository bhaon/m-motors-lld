---
# OTLP : pods applicatifs (component=api / component=web), tous namespaces applicatifs.
# metadata.namespace: monitoring obligatoire si vous faites kubectl apply -f ce fichier
# sans kustomize (sinon les policies sont créées dans « default » et Jaeger reste non protégé côté OTLP).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaeger-otlp-from-apps
  namespace: monitoring
  labels:
    app: jaeger
spec:
  podSelector:
    matchLabels:
      app: jaeger
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              component: api
      ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              component: web
      ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
---
# UI Jaeger : accès depuis Traefik (kube-system) pour l’Ingress HTTPS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaeger-ui-from-traefik
  namespace: monitoring
  labels:
    app: jaeger
spec:
  podSelector:
    matchLabels:
      app: jaeger
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 16686
          protocol: TCP
