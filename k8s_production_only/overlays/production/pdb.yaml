---
# ============================================================
# PodDisruptionBudget — Frontend
# Garantit qu'au moins 1 pod reste disponible lors d'une
# maintenance (kubectl drain, mise à jour nœud, etc.)
# ============================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: production
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
---
# ============================================================
# PodDisruptionBudget — Backend
# ============================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: production
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend