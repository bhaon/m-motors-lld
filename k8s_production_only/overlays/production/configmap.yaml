---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: production
data:
  NODE_ENV: "production"
  ENVIRONMENT: "production"
  # Base URL publique du frontend (utilisée par le backend pour générer les liens d'email).
  FRONTEND_BASE_URL: "https://netdevops.fr"
  API_INTERNAL_URL: "http://backend"
  API_URL: "https://netdevops.fr/api"
  S3_ENDPOINT_URL: "http://minio:9000"
  S3_PUBLIC_ENDPOINT_URL: "https://s3.netdevops.fr"
  S3_BUCKET: "mmotors-documents-prod"
  ALLOWED_HOSTS: '"netdevops.fr,www.netdevops.fr"'
  ALLOWED_ORIGINS: '"https://netdevops.fr,https://www.netdevops.fr"'
  LOG_LEVEL: "warning"
  DEBUG: "false"
