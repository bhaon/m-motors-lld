---
# ============================================================
# INGRESSROUTE PRODUCTION — Traefik CRD
# Alternative à l'Ingress standard — plus de contrôle
# sur le chaînage des middlewares
#
# UI Jaeger : exposée via Ingress Kubernetes dans le namespace
# « monitoring » (fichier infra/monitoring/jaeger-ingress.yaml), host jaeger.netdevops.fr.
# ============================================================
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-production
  namespace: production
spec:
  entryPoints:
    - websecure
  routes:
    # Route API — rate limiting strict
    - match: Host(`netdevops.fr`) && PathPrefix(`/api`)
      kind: Rule
      middlewares:
        - name: security-headers
          namespace: production
        - name: api-rate-limit
          namespace: production
        - name: compress
          namespace: kube-system
      services:
        - name: backend
          port: 80
    # Route Frontend
    - match: Host(`netdevops.fr`) || Host(`www.netdevops.fr`)
      kind: Rule
      middlewares:
        - name: security-headers
          namespace: production
        - name: rate-limit
          namespace: production
        - name: compress
          namespace: kube-system
      services:
        - name: frontend
          port: 80
  tls:
    secretName: production-tls-secret